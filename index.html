<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-24">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-38NFBYFGWS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-38NFBYFGWS');
    </script>

    <!-- Default title/description (overridden per-page by react-helmet-async) -->
    <title>AfroPlay — Africa's Web3 Gaming &amp; Media Platform</title>
    <meta name="description" content="AfroPlay connects Web3 games with Africa's 60M+ gamers through community, content, and partnerships. Home of the Onchain Africa interview series." />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Default Open Graph (overridden per-page) -->
    <meta property="og:site_name" content="AfroPlay" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AfroPlay — Africa's Web3 Gaming &amp; Media Platform" />
    <meta property="og:description" content="AfroPlay connects Web3 games with Africa's 60M+ gamers through community, content, and partnerships." />
    <meta property="og:image" content="https://afroplay.org/og/gaming.svg" />
    <meta property="og:url" content="https://afroplay.org" />

    <!-- Default Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AfroPlayHQ" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Russo+One&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              heading: ['Russo One', 'sans-serif'],
            },
            colors: {
              afro: {
                bg: '#0F0502',
                orange: '#FF6B00',
                accent: '#A020F0',
                card: '#1A0F0A',
              }
            }
          }
        }
      }
    </script>

    <!-- Static site-wide JSON-LD (visible to all crawlers before JS runs) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://afroplay.org/#organization",
          "name": "AfroPlay",
          "url": "https://afroplay.org",
          "logo": "https://afroplay.org/logo.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "connect@afroplay.org",
            "contactType": "partnerships"
          },
          "foundingLocation": { "@type": "Place", "name": "Nigeria" },
          "areaServed": "Africa",
          "sameAs": [
            "https://x.com/AfroPlayHQ",
            "https://www.youtube.com/@AfroPlayStudio",
            "https://www.linkedin.com/company/afro-play/",
            "https://www.tiktok.com/@afro_play",
            "https://www.instagram.com/afroplaystudio/",
            "https://discord.gg/GJVNA6TG"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://afroplay.org/#website",
          "name": "AfroPlay",
          "url": "https://afroplay.org",
          "publisher": { "@id": "https://afroplay.org/#organization" }
        }
      ]
    }
    </script>

    <style>
      body {
        background-color: #0F0502;
        color: white;
        /* Clip horizontal overflow without breaking position:sticky (unlike overflow-x:hidden) */
        overflow-x: clip;
      }
      .neon-text {
        text-shadow: 0 0 10px rgba(255, 107, 0, 0.5);
      }
      .neon-box {
        box-shadow: 0 0 20px rgba(255, 107, 0, 0.15);
      }
      @keyframes africa-float {
        0%   { transform: translate3d(0,    0, 0) scale(1);    }
        50%  { transform: translate3d(0, -12px, 0) scale(1.02); }
        100% { transform: translate3d(0,    0, 0) scale(1);    }
      }
      @keyframes africa-glow {
        0%, 100% { opacity: 0.7; }
        50%       { opacity: 1;   }
      }
      @keyframes africa-flag-drift {
        0%, 100% { transform: translate3d(0,     0, 0); }
        50%      { transform: translate3d(0, 1.5px, 0); }
      }
      @keyframes africa-flag-twinkle {
        0%, 100% { opacity: 0.6;  }
        50%      { opacity: 0.95; }
      }
      .africa-map-float    { animation: africa-float   18s ease-in-out infinite; }
      .africa-glow-pulse   { animation: africa-glow     6s ease-in-out infinite; }
      .africa-flag-drift   { animation: africa-flag-drift  10s ease-in-out infinite; }
      .africa-flag-twinkle { animation: africa-flag-twinkle  6s ease-in-out infinite; }

      /* On-load entrance animations */
      @keyframes slideUp      { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideInLeft  { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes fadeInAnim   { from { opacity: 0; } to { opacity: 1; } }
      @keyframes scaleInAnim  { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
      .anim-slide-up   { animation: slideUp     0.65s ease-out forwards; }
      .anim-slide-left { animation: slideInLeft  0.55s ease-out forwards; }
      .anim-fade-in    { animation: fadeInAnim   0.65s ease-out forwards; }
      .anim-scale-in   { animation: scaleInAnim  0.65s ease-out forwards; }

      /* Marquee (preserved for compatibility) */
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .animate-marquee       { animation: marquee 32s linear infinite; }
      .animate-marquee:hover { animation-play-state: paused; }

      /* Scrollbar utility */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Delay helpers */
      .anim-d1 { animation-delay: 0.10s; opacity: 0; }
      .anim-d2 { animation-delay: 0.25s; opacity: 0; }
      .anim-d3 { animation-delay: 0.40s; opacity: 0; }
      .anim-d4 { animation-delay: 0.55s; opacity: 0; }
      .anim-d5 { animation-delay: 0.70s; opacity: 0; }
      .anim-d6 { animation-delay: 0.85s; opacity: 0; }
      .anim-d7 { animation-delay: 1.00s; opacity: 0; }
      .anim-d8 { animation-delay: 1.15s; opacity: 0; }

      /* ── Mobile overrides (<768 px) ─────────────────────────────────────────
         On phones, fast flick-scrolling outruns IntersectionObserver. Kill all
         entrance animations so sections are always visible. Also disable the
         floating/glow infinite animations that burn battery and scroll FPS. */
      @media (max-width: 767px) {
        .anim-slide-up, .anim-slide-left, .anim-fade-in, .anim-scale-in,
        .anim-d1, .anim-d2, .anim-d3, .anim-d4,
        .anim-d5, .anim-d6, .anim-d7, .anim-d8 {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .africa-map-float, .africa-glow-pulse,
        .africa-flag-drift, .africa-flag-twinkle,
        .animate-marquee {
          animation: none !important;
        }
      }

      /* ── Respect prefers-reduced-motion at all widths ───────────────────── */
      @media (prefers-reduced-motion: reduce) {
        .anim-slide-up, .anim-slide-left, .anim-fade-in, .anim-scale-in,
        .anim-d1, .anim-d2, .anim-d3, .anim-d4,
        .anim-d5, .anim-d6, .anim-d7, .anim-d8 {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .africa-map-float, .africa-glow-pulse,
        .africa-flag-drift, .africa-flag-twinkle,
        .animate-marquee {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
